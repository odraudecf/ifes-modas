# Ambiente local completo: Postgres + API (mesma imagem que vai para o Render).
#   docker compose up --build
#   API:     http://localhost:8080/swagger
#   Front:   cd frontend && npm run dev   (http://localhost:5173)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ifes_modas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ifes_modas"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=ifes_modas;Username=postgres;Password=postgres"
      Jwt__Key: "chave-local-do-docker-compose-com-mais-de-32-caracteres"
      Cors__Origins: "http://localhost:5173"
    ports:
      - "8080:8080"

volumes:
  pgdata:
